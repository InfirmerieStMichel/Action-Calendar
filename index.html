<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel=icon href=wave.png type=imagex-icon>
  <title>Calendrier d'aide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div id="main">

      <h1>Calendrier des optimistes</h1>
      <div class="current-date" id="currentDate"></div>
      <div class="visit-counter">
        <p id="visitsCount">Nombre de visites globales : </p>
      </div>
      
      
      <div class="calendar-container">
        <table>
          <thead>
            <tr>
              <th class="day-name">Lundi</th>
              <th class="day-name">Mardi</th>
              <th class="day-name">Mercredi</th>
              <th class="day-name">Jeudi</th>
              <th class="day-name">Vendredi</th>
              <th class="day-name">Samedi</th>
              <th class="day-name">Dimanche</th>
            </tr>
          </thead>
          <tbody id="calendar">
            <!-- Les jours du mois seront générés dynamiquement ici -->
          </tbody>
        </table>
      </div> 

    </div>
    <footer>
      <p>© 2024 développée par Maxime HENRIST</p>
    </footer> 
    
  </div>


  <div id="popupForm">
    <p id="popupText"></p>
    <button onclick="closeForm()">Fermer</button>
  </div>


<script src="script.js"></script>
</body>
</html>
